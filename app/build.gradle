plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.dualqueue'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.dualqueue'
        minSdk 31
        targetSdk 35
        versionCode 5
        versionName '1.4'
    }

    signingConfigs {
        release {
            storeFile file('dualqueue-release.keystore')
            storeType 'JKS'
            storePassword 'dualqueue123'
            keyAlias 'dualqueue'
            keyPassword 'dualqueue123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.32'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
