name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble and patch MemSort source
        run: |
          mkdir -p app/src/main/java/com/example/dualqueue
          cat .buildsrc/MainActivity.part* > app/src/main/java/com/example/dualqueue/MainActivity.java
          cat .buildsrc/VoskHoldRecorder.part* > app/src/main/java/com/example/dualqueue/VoskHoldRecorder.kt
          python3 .buildsrc/patch_memsort_vosk.py

      - name: Bundle multilingual Vosk mobile models
        run: |
          set -euo pipefail
          rm -rf app/src/main/assets/vosk-model-* /tmp/vosk-models
          mkdir -p app/src/main/assets /tmp/vosk-models

          fetch_model() {
            code="$1"
            name="$2"
            curl --fail --location --retry 3 --output "/tmp/vosk-models/${name}.zip" "https://alphacephei.com/vosk/models/${name}.zip"
            mkdir -p "/tmp/vosk-models/${code}"
            unzip -q "/tmp/vosk-models/${name}.zip" -d "/tmp/vosk-models/${code}"
            mv "/tmp/vosk-models/${code}/${name}" "app/src/main/assets/vosk-model-${code}"
            test -f "app/src/main/assets/vosk-model-${code}/conf/model.conf"
          }

          fetch_model en vosk-model-small-en-us-0.15
          fetch_model it vosk-model-small-it-0.22
          fetch_model fr vosk-model-small-fr-0.22
          fetch_model es vosk-model-small-es-0.42
          fetch_model de vosk-model-small-de-0.15
          fetch_model ja vosk-model-small-ja-0.22

      - name: Restore signing keystore
        run: base64 --decode .buildsrc/dualqueue-release.keystore.b64 > app/dualqueue-release.keystore

      - name: Build signed MemSort release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Verify APK package metadata
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging app/build/outputs/apk/release/app-release.apk | head -30

      - name: Verify all Vosk models packaged
        run: |
          for code in en it fr es de ja; do
            unzip -l app/build/outputs/apk/release/app-release.apk | grep "assets/vosk-model-${code}/conf/model.conf"
          done

      - name: Upload MemSort APK
        uses: actions/upload-artifact@v4
        with:
          name: MemSort-v1.4-mode-constrained-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
