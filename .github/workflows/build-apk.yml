name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble MainActivity source
        run: |
          mkdir -p app/src/main/java/com/example/dualqueue
          cat .buildsrc/MainActivity.part* > app/src/main/java/com/example/dualqueue/MainActivity.java

      - name: Restore signing keystore
        run: base64 --decode .buildsrc/dualqueue-release.keystore.b64 > app/dualqueue-release.keystore

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Verify APK package metadata
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging app/build/outputs/apk/release/app-release.apk | head -30

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: dual-queue-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
